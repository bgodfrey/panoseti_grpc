services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - panoseti-net

  test_runner:
    build:
      context: ../../
      dockerfile: tests/gnss_control/Dockerfile
      target: runner
    environment:
      - REDIS_HOST=redis
      - GRPC_PORT=50051
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - panoseti-net

networks:
  panoseti-net:
    driver: bridge
